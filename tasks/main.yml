---
- name: "Include variables wrapper"
  ansible.builtin.include_tasks:
    file: variables.yml
  tags: ["ct-openjdk"]

- name: "Disto/Family tasks (FF)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
      - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
      - "{{ ansible_facts['distribution'] }}.yml"
      - "{{ ansible_facts['os_family'] }}.yml"
      - "default.yml"
  tags: ["ct-openjdk"]

- name: 'Set OpenJDK package state: {{ "openjdk-%s v%s --> %s" % (openjdk_jdk_or_jre, openjdk_version, openjdk_state) }}'
  ansible.builtin.apt:
    name: openjdk-{{ openjdk_version | int }}-{{ openjdk_jdk_or_jre }}
    state: '{{ openjdk_state }}'
  become: true
  tags: ["ct-openjdk"]
...
